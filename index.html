<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flyer Promocional</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
    }
    .container {
      width: 100%;
      max-width: 500px;
      padding: 10px;
      text-align: center;
    }
    img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: block;
    }
    .loading { color: #fff; font-size: 14px; padding: 20px; }
    .error { color: #ff6b6b; font-size: 14px; padding: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div id="status" class="loading">Cargando flyer...</div>
    <img id="flyer-img" src="" alt="Flyer" style="display:none;" />
  </div>

  <script>
    const SUPABASE_URL = 'https://elxlurzbahutggkhlipq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVseGx1cnpiYWh1dGdna2hsaXBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MzQyODQsImV4cCI6MjEwNjMxMDI4NH0.qM9IGG6rW6wZAvR9Cy4LnlbVLGk2C8-Eov4FEaczGqs';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadFlyer() {
      const status = document.getElementById('status');
      const img = document.getElementById('flyer-img');

      try {
        const { data, error } = await client
          .from('flyers')
          .select('image_url')
          .eq('id', 'flyer-principal')
          .single();

        if (error) {
          console.error('Error al consultar Supabase:', error);
          status.className = 'error';
          status.innerText = 'Error al cargar flyer: ' + error.message;
          return;
        }

        if (!data || !data.image_url) {
          status.className = 'error';
          status.innerText = 'Aún no se ha subido ningún flyer.';
          return;
        }

        img.src = data.image_url;
        img.onload = () => {
          status.style.display = 'none';
          img.style.display = 'block';
        };
        img.onerror = () => {
          status.className = 'error';
          status.innerText = 'No se pudo cargar la imagen desde la URL.';
        };
      } catch (err) {
        console.error('Error de red/servidor:', err);
        status.className = 'error';
        status.innerText = 'Error de conexión con el servidor.';
      }
    }

    loadFlyer();
  </script>
</body>
</html>
